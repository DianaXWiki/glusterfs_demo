syntax = "proto3";

package glusterfs.sharding;

// Serviciu pentru a obține informații despre sharding
service ShardingInfo {
  // Obține informații despre toate shard-urile
  rpc GetAllShards (GetAllShardsRequest) returns (GetAllShardsResponse) {}

  // Obține informații despre un shard specific
  rpc GetShardInfo (GetShardInfoRequest) returns (GetShardInfoResponse) {}

  // Stream pentru a primi actualizări în timp real
  rpc StreamShardChanges (StreamShardChangesRequest) returns (stream ShardChange) {}
}

// Structuri de cerere și răspuns

message GetAllShardsRequest {
  string volume_name = 1;
}

message GetAllShardsResponse {
  repeated ShardInfo shards = 1;
}

message GetShardInfoRequest {
  string volume_name = 1;
  string shard_id = 2;
}

message GetShardInfoResponse {
  ShardInfo shard = 1;
}

message StreamShardChangesRequest {
  string volume_name = 1;
  bool include_file_operations = 2;
}

message ShardChange {
  enum ChangeType {
    CREATED = 0;
    MODIFIED = 1;
    DELETED = 2;
    REBALANCED = 3;
  }
  string shard_id = 1;
  ChangeType change_type = 2;
  uint64 timestamp = 3;
  FileInfo affected_file = 4;
}

// Structuri pentru informațiile despre shard-uri

message ShardInfo {
  string shard_id = 1;
  string host_brick = 2;
  uint64 size_bytes = 3;
  uint32 file_count = 4;
  repeated FileInfo files = 5;
  ShardingStats stats = 6;
}

message FileInfo {
  string path = 1;
  string original_gfid = 2;
  repeated string shard_gfids = 3;
  uint64 size = 4;
  uint32 chunk_count = 5;
}

message ShardingStats {
  uint64 read_ops = 1;
  uint64 write_ops = 2;
  double avg_access_time = 3;
  uint64 rebalance_count = 4;
}